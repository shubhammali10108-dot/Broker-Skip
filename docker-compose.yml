version: '3.8'

services:
  # MySQL Database Service
  mysql:
    image: mysql:8.0
    container_name: broker-skip-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: broker_skip_db
      MYSQL_USER: broker_user
      MYSQL_PASSWORD: broker_password
    ports:
      - "3306:3306"
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql_data:/var/lib/mysql
    networks:
      - broker-skip-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Spring Boot Backend Service
  broker-skip-backend:
    image: openjdk:11-jre-slim
    container_name: broker-skip-backend
    working_dir: /app
    volumes:
      - ./backend:/app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/broker_skip_db?useSSL=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: broker_user
      SPRING_DATASOURCE_PASSWORD: broker_password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    command: sh -c "cd /app && mvn spring-boot:run"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - broker-skip-network

networks:
  broker-skip-network:
    driver: bridge

volumes:
  mysql_data:
