# Server Configuration
server.port=8080
server.servlet.context-path=/api

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/broker_skip_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=broker_user
spring.datasource.password=broker_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# Logging Configuration
logging.level.root=INFO
logging.level.com.brokerskip=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# Application Configuration
app.name=Broker Skip
app.version=1.0.0

# JWT Configuration
jwt.secret=BrokerSkip@SecretKey@RealEstate@2024@VeryLongKeyForJWT
jwt.expiration=86400000

# OTP Configuration
otp.expiration.minutes=5
otp.length=6

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# CORS Configuration
cors.allowed-origins=http://localhost:3000,http://localhost:4200
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*
cors.max-age=3600

# Timezone
spring.jackson.time-zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false
