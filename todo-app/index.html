<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List Application</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="header-content">
                <div class="header-left">
                    <h1 class="app-title">📋 My Tasks</h1>
                    <p class="app-subtitle">Stay organized and productive</p>
                </div>
                <div class="header-right">
                    <button id="darkModeBtn" class="icon-btn" title="Toggle dark mode">
                        🌙
                    </button>
                    <button id="statsBtn" class="icon-btn" title="View statistics">
                        📊
                    </button>
                    <button id="exportBtn" class="icon-btn" title="Export data">
                        💾
                    </button>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="app-main">
            <!-- Sidebar -->
            <aside class="app-sidebar">
                <div class="sidebar-section">
                    <h3>Categories</h3>
                    <button class="category-btn active" data-category="all">
                        📌 All Tasks
                    </button>
                    <button class="category-btn" data-category="work">
                        💼 Work
                    </button>
                    <button class="category-btn" data-category="personal">
                        👤 Personal
                    </button>
                    <button class="category-btn" data-category="shopping">
                        🛒 Shopping
                    </button>
                </div>

                <div class="sidebar-section">
                    <h3>Quick Filters</h3>
                    <button class="filter-btn" data-filter="today">
                        📅 Due Today
                    </button>
                    <button class="filter-btn" data-filter="overdue">
                        ⚠️ Overdue
                    </button>
                    <button class="filter-btn" data-filter="completed">
                        ✅ Completed
                    </button>
                    <button class="filter-btn" data-filter="pending">
                        ⏳ Pending
                    </button>
                </div>

                <div class="sidebar-section">
                    <h3>Statistics</h3>
                    <div class="stats-widget">
                        <div class="stat-item">
                            <span class="stat-label">Total</span>
                            <span class="stat-value" id="totalTasks">0</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">Done</span>
                            <span class="stat-value" id="completedTasks">0</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">%</span>
                            <span class="stat-value" id="completionPercent">0</span>
                        </div>
                    </div>
                </div>
            </aside>

            <!-- Content Area -->
            <div class="app-content">
                <!-- Add Task Section -->
                <section class="add-task-section">
                    <div class="task-input-group">
                        <input 
                            type="text" 
                            id="taskInput" 
                            class="task-input" 
                            placeholder="Add a new task..."
                            autocomplete="off"
                        >
                        <button id="addTaskBtn" class="btn btn-primary">Add Task</button>
                    </div>

                    <div class="task-options">
                        <select id="categorySelect" class="input-select">
                            <option value="personal">Personal</option>
                            <option value="work">Work</option>
                            <option value="shopping">Shopping</option>
                        </select>

                        <select id="prioritySelect" class="input-select">
                            <option value="medium">Priority</option>
                            <option value="high">High</option>
                            <option value="medium">Medium</option>
                            <option value="low">Low</option>
                        </select>

                        <input 
                            type="date" 
                            id="dueDateInput" 
                            class="input-select"
                        >
                    </div>
                </section>

                <!-- Search Section -->
                <section class="search-section">
                    <div class="search-group">
                        <input 
                            type="text" 
                            id="searchInput" 
                            class="search-input" 
                            placeholder="🔍 Search tasks..."
                        >
                        <button id="clearSearchBtn" class="icon-btn-small">✕</button>
                    </div>

                    <div class="sort-options">
                        <button class="sort-btn" data-sort="dueDate">📅 Due Date</button>
                        <button class="sort-btn" data-sort="priority">⚡ Priority</button>
                        <button class="sort-btn" data-sort="created">🕐 Created</button>
                    </div>
                </section>

                <!-- Tasks List -->
                <section class="tasks-section">
                    <div id="tasksList" class="tasks-list">
                        <!-- Tasks will be rendered here -->
                    </div>

                    <!-- Empty State -->
                    <div id="emptyState" class="empty-state" style="display: none;">
                        <div class="empty-icon">📝</div>
                        <h2>No tasks yet</h2>
                        <p>Add a task to get started!</p>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <!-- Edit Task Modal -->
    <div id="editModal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Edit Task</h2>
                <button class="modal-close" id="closeModalBtn">✕</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>Task Title</label>
                    <input type="text" id="editTaskTitle" class="form-input">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Category</label>
                        <select id="editCategory" class="form-select">
                            <option value="personal">Personal</option>
                            <option value="work">Work</option>
                            <option value="shopping">Shopping</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Priority</label>
                        <select id="editPriority" class="form-select">
                            <option value="high">High</option>
                            <option value="medium">Medium</option>
                            <option value="low">Low</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>Due Date</label>
                    <input type="date" id="editDueDate" class="form-input">
                </div>
                <div class="form-group">
                    <label>Notes</label>
                    <textarea id="editNotes" class="form-textarea" placeholder="Add notes..."></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button id="cancelEditBtn" class="btn btn-secondary">Cancel</button>
                <button id="saveEditBtn" class="btn btn-primary">Save Changes</button>
            </div>
        </div>
    </div>

    <!-- Statistics Modal -->
    <div id="statsModal" class="modal" style="display: none;">
        <div class="modal-content modal-stats">
            <div class="modal-header">
                <h2>Statistics</h2>
                <button class="modal-close" id="closeStatsBtn">✕</button>
            </div>
            <div class="modal-body">
                <div class="stats-grid">
                    <div class="stats-card">
                        <div class="stats-icon">📊</div>
                        <div class="stats-data">
                            <div class="stats-number" id="statTotal">0</div>
                            <div class="stats-label">Total Tasks</div>
                        </div>
                    </div>
                    <div class="stats-card">
                        <div class="stats-icon">✅</div>
                        <div class="stats-data">
                            <div class="stats-number" id="statCompleted">0</div>
                            <div class="stats-label">Completed</div>
                        </div>
                    </div>
                    <div class="stats-card">
                        <div class="stats-icon">⏳</div>
                        <div class="stats-data">
                            <div class="stats-number" id="statPending">0</div>
                            <div class="stats-label">Pending</div>
                        </div>
                    </div>
                    <div class="stats-card">
                        <div class="stats-icon">📈</div>
                        <div class="stats-data">
                            <div class="stats-number" id="statPercent">0%</div>
                            <div class="stats-label">Completion</div>
                        </div>
                    </div>
                </div>

                <div class="stats-chart">
                    <h3>Tasks by Category</h3>
                    <div id="categoryStats" class="category-stats">
                        <!-- Category stats will be rendered here -->
                    </div>
                </div>

                <div class="stats-chart">
                    <h3>Tasks by Priority</h3>
                    <div id="priorityStats" class="priority-stats">
                        <!-- Priority stats will be rendered here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast" style="display: none;"></div>

    <!-- Scripts -->
    <script src="js/storage.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
