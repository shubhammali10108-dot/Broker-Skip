<div class="create-post-container">
    <div class="create-post-card">
        <h1>Create Property Listing</h1>

        <form ng-submit="createProperty()" class="property-form">
            <div class="form-group">
                <label>Title *</label>
                <input type="text" ng-model="property.title" required>
            </div>

            <div class="form-group">
                <label>Description</label>
                <textarea ng-model="property.description" placeholder="Describe the property"></textarea>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Property Type *</label>
                    <select ng-model="property.propertyType" required>
                        <option value="">Select Type</option>
                        <option value="Apartment">Apartment</option>
                        <option value="House">House</option>
                        <option value="Land">Land</option>
                        <option value="Commercial">Commercial</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Price (₹) *</label>
                    <input type="number" ng-model="property.price" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Area (sq ft)</label>
                    <input type="number" ng-model="property.area">
                </div>

                <div class="form-group">
                    <label>Bedrooms</label>
                    <input type="number" ng-model="property.bedrooms" min="0">
                </div>

                <div class="form-group">
                    <label>Bathrooms</label>
                    <input type="number" ng-model="property.bathrooms" min="0">
                </div>
            </div>

            <div class="form-group">
                <label>Location *</label>
                <input type="text" ng-model="property.location" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>City *</label>
                    <input type="text" ng-model="property.city" required>
                </div>

                <div class="form-group">
                    <label>State *</label>
                    <input type="text" ng-model="property.state" required>
                </div>

                <div class="form-group">
                    <label>Pincode</label>
                    <input type="text" ng-model="property.pincode">
                </div>
            </div>

            <div class="form-group">
                <label>Amenities</label>
                <div class="checkbox-group">
                    <label><input type="checkbox" ng-model="amenities.gym"> Gym</label>
                    <label><input type="checkbox" ng-model="amenities.pool"> Swimming Pool</label>
                    <label><input type="checkbox" ng-model="amenities.parking"> Parking</label>
                    <label><input type="checkbox" ng-model="amenities.security"> Security</label>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-block">Create Listing</button>
        </form>
    </div>
</div>

<style>
.create-post-container {
    max-width: 700px;
    margin: 0 auto;
}

.create-post-card {
    background: white;
    padding: 2rem;
    border-radius: 12px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.1);
}

.create-post-card h1 {
    color: #667eea;
    margin-bottom: 2rem;
}

.property-form {
    display: flex;
    flex-direction: column;
}

.form-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 1rem;
}

.checkbox-group {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
}

.checkbox-group label {
    display: flex;
    align-items: center;
    font-weight: normal;
}

.checkbox-group input[type="checkbox"] {
    margin-right: 0.5rem;
}
</style>
