<div class="profile-creation-container">
    <div class="profile-creation-card">
        <h1>Create Your Profile</h1>
        <p class="subtitle">Complete your profile to get started</p>

        <form ng-submit="createProfile()" class="profile-form">
            <div class="form-group">
                <label>First Name *</label>
                <input type="text" ng-model="profile.firstName" required>
            </div>

            <div class="form-group">
                <label>Last Name *</label>
                <input type="text" ng-model="profile.lastName" required>
            </div>

            <div class="form-group">
                <label>Email *</label>
                <input type="email" ng-model="profile.email" required>
            </div>

            <div class="form-group">
                <label>City</label>
                <input type="text" ng-model="profile.city">
            </div>

            <div class="form-group">
                <label>State</label>
                <input type="text" ng-model="profile.state">
            </div>

            <div class="form-group">
                <label>Pincode</label>
                <input type="text" ng-model="profile.pincode">
            </div>

            <div class="form-group">
                <label>Bio</label>
                <textarea ng-model="profile.bio" placeholder="Tell us about yourself"></textarea>
            </div>

            <button type="submit" class="btn btn-primary btn-block">Create Profile</button>
        </form>
    </div>
</div>

<style>
.profile-creation-container {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: #f5f5f5;
    padding: 2rem;
}

.profile-creation-card {
    background: white;
    padding: 2rem;
    border-radius: 12px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    width: 100%;
    max-width: 500px;
}

.profile-creation-card h1 {
    color: #667eea;
    margin-bottom: 0.5rem;
}

.subtitle {
    color: #999;
    margin-bottom: 2rem;
}

.profile-form {
    display: flex;
    flex-direction: column;
}
</style>
