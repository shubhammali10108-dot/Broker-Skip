<!DOCTYPE html>
<html ng-app="brokerSkipApp">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Broker Skip - Real Estate Platform</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="node_modules/angular/angular.min.js"></script>
    <script src="node_modules/angular-route/angular-route.min.js"></script>
    <script src="node_modules/angular-resource/angular-resource.min.js"></script>
</head>
<body ng-controller="MainController">
    <div class="app-container">
        <!-- Header -->
        <header ng-show="isLoggedIn" class="header">
            <div class="header-content">
                <div class="logo">Broker Skip</div>
                <div class="header-center">
                    <button ng-click="goToCreatePost()" class="btn-create-post">+ Create Post</button>
                </div>
                <div class="header-right">
                    <button ng-click="toggleProfileMenu()" class="profile-btn">{{currentUser.firstName}}</button>
                    <div class="profile-menu" ng-show="showProfileMenu">
                        <a ng-click="navigateTo('profile')">My Profile</a>
                        <a ng-click="logout()">Logout</a>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Sidebar Navigation -->
            <aside ng-show="isLoggedIn" class="sidebar">
                <nav class="nav-menu">
                    <a ng-click="navigateTo('dashboard')" ng-class="{active: currentPage === 'dashboard'}" class="nav-item">All Posts</a>
                    <a ng-click="navigateTo('myPosts')" ng-class="{active: currentPage === 'myPosts'}" class="nav-item">My Posts</a>
                    <a ng-click="navigateTo('favorites')" ng-class="{active: currentPage === 'favorites'}" class="nav-item">Favorites</a>
                    <a ng-click="navigateTo('profile')" ng-class="{active: currentPage === 'profile'}" class="nav-item">Profile</a>
                </nav>
            </aside>

            <!-- Content Area -->
            <div class="content-area">
                <ng-view></ng-view>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/app.js"></script>
    <script src="js/controllers/MainController.js"></script>
    <script src="js/controllers/AuthController.js"></script>
    <script src="js/controllers/DashboardController.js"></script>
    <script src="js/controllers/ProfileController.js"></script>
    <script src="js/services/AuthService.js"></script>
    <script src="js/services/PropertyService.js"></script>
    <script src="js/services/FavoriteService.js"></script>
</body>
</html>
